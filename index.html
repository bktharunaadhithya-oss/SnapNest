<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapNest</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header id ="top-bar">
        <h1>SnapNest</h1>
        <p>Find stunning images for your next project.</p>
    </header>
    <form class="search-form">
        <label for="search-input">Search for images:</label>
        <input type="search" id="search-input" placeholder="Try Mountains, Cats, Space...">
        <button id="search-btn" type="submit">Search</button>
    </form>
    <div id="quick-picks"> 
        <button>Nature</button>
        <button>Cities</button>
        <button>Animals</button>
    </div>
    <main class="container">
        <p id="result-count">Showing 0 results</p>
        <p id="empty-state">Search to discover amazing images</p>
        <section id="results"> </section>
    </main>

  <script src="script.js"></script>
</body>
</html>>
